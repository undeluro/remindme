# Development Docker Compose — hot-reload for both services
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: remindme-backend-dev
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - chroma_data:/app/chroma_data
      # Keep the Python packages (~8 GB) and downloaded models in Docker volumes, not in the bind-mounted
      # project folder: reading them through the Windows/macOS file share made every backend restart
      # take 5-8 minutes. The venv volume is filled from the image on first start, so nothing is reinstalled.
      - backend_venv:/app/.venv
      - model_cache:/root/.cache
      - deepface_weights:/root/.deepface
    command: uv run fastapi dev --host 0.0.0.0
    restart: unless-stopped

  frontend:
    image: node:22-alpine
    container_name: remindme-frontend-dev
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  chroma_data:
  frontend_node_modules:
  backend_venv:
  model_cache:
  deepface_weights:
