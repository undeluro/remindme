# Development Docker Compose — hot-reload for both services
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: remindme-backend-dev
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - chroma_data:/app/chroma_data
    command: uv run fastapi dev --host 0.0.0.0
    restart: unless-stopped

  frontend:
    image: node:22-alpine
    container_name: remindme-frontend-dev
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  chroma_data:
  frontend_node_modules:
