services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: remindme-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - chroma_data:/app/chroma_data
      - ./backend/patient_context.json:/app/patient_context.json
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: ""
        VITE_WS_URL: ""
    container_name: remindme-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  chroma_data:
